# Contributor CI: typecheck, tests, build. Runs for every pull request and
# push to main. Uses no secrets, so it is safe for fork pull requests.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; keep every push-to-main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The release workflow's validate job looks this job up by its exact
    # name ("test") via the Checks API — rename both together.
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for Electron's ABI
        # The test suite runs under the Electron binary (see AGENTS.md), so
        # the native module must match Electron's ABI, not Node's.
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        # The suite runs Electron with ELECTRON_RUN_AS_NODE=1 and opens no
        # windows, but the Electron binary on Linux still initializes
        # against display libraries at startup — xvfb-run keeps that safe
        # on a headless runner. (test:uimode:live is deliberately excluded
        # from CI: it needs an external Playwright project and network.)
        run: xvfb-run --auto-servernum npm run test:uimode

      - name: Build
        run: npm run build
