# Tag-driven production releases.
#
#   validate ──► build-macos (arm64 + x64, signed + notarized)
#            ──► build-windows (x64, Authenticode signed)      ──► publish
#            ──► build-linux (x64, AppImage + deb)
#
# Platform jobs hand their outputs forward as short-retention workflow
# artifacts; only the final publish job creates the GitHub Release, so a
# partially built release can never be published. Signing/notarization
# secrets live in the protected "release" environment and never reach
# pull-request workflows. A workflow_dispatch run is a non-publishing dry
# run: it builds, signs, and verifies everything but creates no release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-flight.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.mode.outputs.version }}
      tag: ${{ steps.mode.outputs.tag }}
      publish: ${{ steps.mode.outputs.publish }}
      prerelease: ${{ steps.mode.outputs.prerelease }}
    steps:
      - name: Check out (full history for ancestry validation)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Determine release mode and validate the tag
        id: mode
        env:
          # Never interpolate ref names directly into shell text — always
          # via env, and validate against a strict pattern before any use.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            echo "Dry run for version $VERSION — builds and verifies, publishes nothing."
            {
              echo "publish=false"
              echo "tag="
              echo "version=$VERSION"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Release runs must be triggered by a version tag"
            exit 1
          fi
          TAG="$REF_NAME"
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)\.(0|[1-9][0-9]*))?$'; then
            echo "::error::Tag is not valid SemVer of the form vMAJOR.MINOR.PATCH, vMAJOR.MINOR.PATCH-beta.N, or vMAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi

          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match package.json version ($PKG_VERSION). Land a version PR on main first, then tag."
            exit 1
          fi

          PRERELEASE=false
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
          esac

          {
            echo "publish=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing Wrightbench $VERSION (prerelease: $PRERELEASE)"

      - name: Require the tagged commit to be contained in origin/main
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          git rev-parse --verify origin/main >/dev/null
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tagged commit $SHA is not contained in origin/main — only tag commits that have landed on main"
            exit 1
          fi
          echo "Tagged commit is on origin/main."

      - name: Require a successful CI run for the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          conclusions="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
            --jq '[.check_runs[] | select(.name == "test") | .conclusion] | join(" ")')"
          echo "CI 'test' check conclusions for $SHA: ${conclusions:-none}"
          if ! printf '%s' "$conclusions" | grep -qw "success"; then
            echo "::error::The CI job 'test' has not completed successfully for $SHA. Wait for CI on main to pass, then re-run this workflow."
            exit 1
          fi

      - name: Require that the tag has no published release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q '^false$'; then
            echo "::error::A published release already exists for $TAG — refusing to overwrite it"
            exit 1
          fi
          echo "No published release exists for $TAG."

      - name: Verify the lockfile is synchronized with package.json
        run: npm ci --ignore-scripts

  build-macos:
    name: macOS ${{ matrix.arch }} (signed + notarized)
    needs: validate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture builds on its native runner so better-sqlite3
          # compiles natively and both binaries are verified independently.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require macOS signing and notarization secrets (fail closed)
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required release secrets:$missing. Production macOS builds must be signed and notarized — configure the secrets in the 'release' environment (see docs/RELEASING.md). Refusing to build unsigned."
            exit 1
          fi
          echo "All macOS signing secrets are present."

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decode the App Store Connect API key into RUNNER_TEMP
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/wrightbench-notary-key.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::Decoded App Store Connect API key is empty"
            exit 1
          fi

      - name: Build application bundles
        run: npm run build

      - name: Package, sign, and notarize the app
        # electron-builder signs the app (hardened runtime + minimal
        # entitlements), notarizes it with @electron/notarize, staples the
        # ticket, then packs the DMG/ZIP from the stapled app and signs the
        # outer DMG (dmg.sign in package.json).
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/wrightbench-notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --"$ARCH" --publish never

      - name: Notarize and staple the DMG
        # electron-builder notarizes the app but not the disk image around
        # it; Gatekeeper's "open" assessment requires the DMG itself to be
        # signed, notarized, and stapled. No updater metadata is generated
        # or published, so nothing goes stale when the DMG is stapled here.
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="release/Wrightbench-$VERSION-mac-$ARCH.dmg"
          test -f "$DMG"
          # The DMG must already carry a usable Developer ID signature.
          codesign --verify --verbose=4 "$DMG"
          RESULT="$RUNNER_TEMP/notarytool-dmg.txt"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/wrightbench-notary-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait | tee "$RESULT"
          if ! grep -q "status: Accepted" "$RESULT"; then
            echo "::error::DMG notarization was not accepted (see the notarytool output above; fetch details with 'xcrun notarytool log')"
            exit 1
          fi
          xcrun stapler staple "$DMG"

      - name: Verify the shipped artifacts
        run: bash scripts/verify-macos-artifacts.sh "$VERSION" "$ARCH"

      - name: Remove the decoded API key
        if: always()
        run: rm -f "$RUNNER_TEMP/wrightbench-notary-key.p8"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            release/Wrightbench-*-mac-${{ matrix.arch }}.dmg
            release/Wrightbench-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-windows:
    name: Windows x64 (signed)
    needs: validate
    environment: release
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Windows signing secrets (fail closed)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          missing=""
          for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required release secrets:$missing. Production Windows installers must carry a timestamped Authenticode signature — configure the secrets in the 'release' environment (see docs/RELEASING.md). Refusing to build unsigned."
            exit 1
          fi
          echo "All Windows signing secrets are present."

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run build

      - name: Package and sign the installer
        # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD are the exact env names this
        # electron-builder version reads for Windows signing; signatures are
        # RFC3161-timestamped by default. forceCodeSigning makes the build
        # fail rather than produce an unsigned installer.
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never -c.forceCodeSigning=true

      - name: Verify the installer signature and metadata
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -Version $env:VERSION

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: release/Wrightbench-Setup-*-win-x64.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-linux:
    name: Linux x64
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run build

      - name: Package AppImage and deb
        run: npx electron-builder --linux --x64 --publish never

      - name: Verify the shipped artifacts
        run: bash scripts/verify-linux-artifacts.sh "$VERSION"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: |
            release/Wrightbench-*-linux-x86_64.AppImage
            release/wrightbench_*_amd64.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: publish
    needs: [validate, build-macos, build-windows, build-linux]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (for SBOM generation)
        run: npm ci --ignore-scripts

      - name: Download platform artifacts into a clean staging directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate the staging directory
        run: bash scripts/verify-release-staging.sh "$VERSION" dist

      - name: Generate the SBOM (SPDX, production dependencies)
        run: |
          npm sbom --sbom-format spdx --sbom-type application --omit dev \
            > "dist/wrightbench-$VERSION.spdx.json"
          node -e "JSON.parse(require('fs').readFileSync('dist/wrightbench-$VERSION.spdx.json','utf8')); console.log('SBOM parses as JSON')"

      - name: Generate SHA256SUMS
        run: |
          cd dist
          LC_ALL=C sha256sum -- * > ../SHA256SUMS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance for all release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          # A leftover *draft* from a previously failed publish attempt is
          # safe to replace; validate already rejected published releases.
          if gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q '^true$'; then
            echo "Deleting leftover draft release for $TAG"
            gh release delete "$TAG" --repo "$REPO" --yes
          fi

          args=(--repo "$REPO" --title "Wrightbench $VERSION" --generate-notes --verify-tag --draft)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*

          # Flip the fully-uploaded draft to published in one step so a
          # partially uploaded release can never appear public.
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
          echo "Published Wrightbench $VERSION: https://github.com/$REPO/releases/tag/$TAG"
